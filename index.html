<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple countdown timer for the moments worth waiting for."
    />
    <title>Countdown Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="timer-shell">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Time well spent</p>
        <h1 id="page-title">Make the wait<br /><em>count.</em></h1>
        <p class="intro-copy">
          Set a date worth looking forward to and let the seconds take care of
          themselves.
        </p>
      </section>

      <section class="timer-panel" aria-label="Countdown timer">
        <div class="panel-topline">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-text">Counting down</span>
          <span class="target-label" id="target-label">your chosen date</span>
        </div>

        <div class="countdown" aria-live="polite">
          <div class="time-block">
            <strong id="days">00</strong>
            <span>days</span>
          </div>
          <div class="divider" aria-hidden="true">:</div>
          <div class="time-block">
            <strong id="hours">00</strong>
            <span>hours</span>
          </div>
          <div class="divider" aria-hidden="true">:</div>
          <div class="time-block">
            <strong id="minutes">00</strong>
            <span>minutes</span>
          </div>
          <div class="divider" aria-hidden="true">:</div>
          <div class="time-block">
            <strong id="seconds">00</strong>
            <span>seconds</span>
          </div>
        </div>

        <div class="panel-footer">
          <label for="target-date">I am counting down to</label>
          <div class="date-row">
            <input
              type="datetime-local"
              id="target-date"
              aria-label="Choose a countdown date and time"
            />
            <button type="button" id="set-date">Set date</button>
          </div>
          <p class="helper" id="helper-text">
            Pick a date in the future to get started.
          </p>
        </div>
      </section>
    </main>

    <footer>Built for the moments between now and next.</footer>
    <script src="script.js"></script>
  </body>
</html>
